name: PhotoBridge
options:
  bundleIdPrefix: com.photobridge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # CI 机器上默认的 Xcode 是 15.x，无法打开 XcodeGen 默认生成的 xcode16_0 格式
  # (objectVersion 77)。降级为 Xcode 15.0 格式，新版本 Xcode 也能正常打开。
  projectFormat: xcode15_0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  PhotoBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Server
    resources:
      - path: Sources/Resources/cert.p12
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/Localizations
    settings:
      base:
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.photobridge.PhotoBridge
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"

schemes:
  PhotoBridge:
    build:
      targets:
        PhotoBridge: all
    run:
      config: Debug
    archive:
      config: Release
