name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: PhotoBridge
        run: xcodegen generate

      - name: Build archive (unsigned)
        working-directory: PhotoBridge
        run: |
          xcodebuild \
            -scheme PhotoBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhotoBridge.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        working-directory: PhotoBridge
        run: |
          mkdir -p build/Payload
          cp -R build/PhotoBridge.xcarchive/Products/Applications/PhotoBridge.app build/Payload/
          cd build
          zip -qr PhotoBridge.ipa Payload
          echo "IPA size: $(du -h PhotoBridge.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-unsigned-ipa
          path: PhotoBridge/build/PhotoBridge.ipa
          if-no-files-found: error
